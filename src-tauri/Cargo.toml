[package]
name = "yizimarkdown"
version = "0.2.1"
description = "YiziMarkdown - A sleek Markdown editor"
authors = ["You"]
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
open = "5"
tauri-plugin-single-instance = "2"
# AI 聊天（v0.2.0）：流式请求 + OS keychain 密钥存储
# keyring v3 无默认后端，必须显式启用平台后端，否则密钥静默丢失
keyring = { version = "3", default-features = false, features = [
  "apple-native",
  "windows-native",
  "sync-secret-service",
  "crypto-rust",
] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "default-tls"] }
futures-util = "0.3"
once_cell = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[features]
# This feature is used for production builds where `devPath` points to the
# filesystem. By default, `devPath` points to the frontend dev server.
custom-protocol = ["tauri/custom-protocol"]
