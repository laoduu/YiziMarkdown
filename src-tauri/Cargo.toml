[package]
name = "yizimarkdown"
version = "0.3.6"
description = "YiziMarkdown - A sleek Markdown editor"
authors = ["You"]
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# 在线更新（v0.3.4）：官方 updater，只服务 Windows NSIS 安装版
# 只加 updater、不加 process —— Windows 上装完由 NSIS 的 /R 自动重启，前端不需要调 relaunch()
tauri-plugin-updater = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
open = "5"
url = "2"
tauri-plugin-single-instance = "2"
# AI 聊天（v0.2.0）：流式请求 + OS keychain 密钥存储
# keyring v3 无默认后端，必须显式启用平台后端，否则密钥静默丢失
keyring = { version = "3", default-features = false, features = [
  "apple-native",
  "windows-native",
  "sync-secret-service",
  "crypto-rust",
] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "default-tls"] }
futures-util = "0.3"
once_cell = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
# 导出 DOCX：markdown 解析 + OOXML 打包（轻量，仅 deflate）
pulldown-cmark = "0.13"
zip = { version = "2", default-features = false, features = ["deflate"] }
# WebDAV 云端存储：PROPFIND multistatus 解析 + 路径百分号编解码
# 两者均已在 Cargo.lock 中（quick-xml 经 plist、percent-encoding 经 url 传递），不引入新 crate
quick-xml = "0.39"
percent-encoding = "2"
# 侧栏右键「删除」走系统回收站（可在回收站还原，不直接销毁）
trash = "3"
# 导出 DOCX 时把 WebP 转码成 PNG：Word / WPS 都不能渲染 WebP（内嵌后在文档里是空框），
# 而预览能正常显示 —— 只开 png/webp 两个解码器/编码器，不带默认格式（不加 jpeg/gif 等）
image = { version = "0.25.10", default-features = false, features = ["png", "webp"] }
# 导出 DOCX 时把 SVG 渲染成 PNG 回退图：Word 2016+ 走 svgBlip 读矢量，旧版 Word / WPS /
# LibreOffice 读这张回退位图（实测 LO 在没有回退图时**什么都不显示**，所以回退图不能省）。
# resvg 全纯 Rust（usvg + tiny-skia + fontdb + skrifa/harfrust），无 C 依赖；
# text + system-fonts 是必需的：SVG 内的文字（含中文）要用系统字体渲染，否则文字会丢。
# 不开 svgz（不支持 .svgz 就够了，省掉 flate2）。
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts", "raster-images"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# 导出 PDF：WebView2 PrintToPdf（与 tauri 2.11 的 webview2-com 版本对齐）
webview2-com = "0.38"
windows-core = "0.61"
# 窗口 1px 系统边框跟随主题背景（Windows 11 DWMWA_BORDER_COLOR）
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[features]
# This feature is used for production builds where `devPath` points to the
# filesystem. By default, `devPath` points to the frontend dev server.
custom-protocol = ["tauri/custom-protocol"]
