# 推送 v* 标签时自动构建并创建 GitHub Release（草稿）。
#
# 资产（4 个，v0.3.4 起不再发布 MSI）：
#   - YiziMarkdown_<ver>_x64-setup.exe   NSIS 安装包      （Windows 腿）
#   - YiziMarkdown_<ver>_x64-portable.zip 便携版          （Windows 腿，make-portable.ps1）
#   - YiziMarkdown_<ver>_source.zip      源码包           （Windows 腿，git archive）
#   - YiziMarkdown_<ver>_universal.dmg   macOS 通用 dmg   （macOS 腿）
#
# Release 正文取 docs/changelog/CHANGELOG-V<ver>.md —— 该文件是**用户向简短版**，
# 与根 changelog.md 的完整技术记录分工（口径见 changelog.md「既定分工」）。
# 同一份文件也被 scripts/make-manifest.mjs 用作应用内更新说明的 notes，所以它必须用户向。
# 默认产出【草稿】，在 GitHub 上确认资产无误后再点 Publish。
#
# 在线更新（v0.3.4 起）：Windows 腿经 --config 打开 createUpdaterArtifacts，额外产出
# YiziMarkdown_<ver>_x64-setup.exe.sig（minisign 签名，私钥来自 secrets.TAURI_SIGNING_PRIVATE_KEY）。
# 该 .sig 与安装包一起上传火山 TOS 供 latest.json 引用；留在 GitHub Release 上无害。
# installMode 是 passive ⇒ 用户装完由 NSIS 的 /R 自动重启，前端不需要调 relaunch()。
#
# 使用：git tag v0.3.2 && git push origin v0.3.2

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: npm ci
        run: npm ci

      - name: npm test
        run: npm test

      # 四道门禁（tsc / check-tauri-args / check-i18n / check-themes）+ vite build
      # 在起昂贵的 Rust 构建之前先把便宜的失败挡掉
      - name: npm run build (gates)
        run: npm run build

      # 在线更新的 pubkey / endpoints 发出去就改不了（公钥被编进 exe，改不了 = 用户只能手动重装），
      # 所以同样放在昂贵的 Rust 构建之前挡住。故意不进 npm run build，见 scripts/check-updater.mjs
      - name: Check updater config (pubkey / endpoints)
        run: node scripts/check-updater.mjs

  build:
    name: Build (${{ matrix.platform }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            # CLI 只认 msi / nsis（wix 是工具名，不是 bundle 名）
            # MSI 线已废弃：Windows 只发 NSIS，在线更新也只用它（见 changelog.md）
            # --config 只在发版时打开 createUpdaterArtifacts。它会让构建强制要求签名私钥，
            # 写进 tauri.conf.json 会连带把本地 npm run tauri:build 也卡死，所以按需合并
            args: --bundles nsis --config src-tauri/tauri.updater.conf.json
          - platform: macos-latest
            args: --target universal-apple-darwin --bundles dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 必须显式安装：tauri-action 直接跑 `npm run tauri`，
      # 没有 node_modules 时会得到 "'tauri' is not recognized"（Windows）/ exit 127（macOS）
      - name: npm ci
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Release notes from CHANGELOG-V*
        id: changelog
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          f="docs/changelog/CHANGELOG-V${ver}.md"
          if [ -f "$f" ]; then
            {
              echo "body<<CHANGELOG_EOF"
              cat "$f"
              echo "CHANGELOG_EOF"
            } >> "$GITHUB_OUTPUT"
            echo "Using release notes from $f"
          else
            echo "body=See CHANGELOG.md in the repository." >> "$GITHUB_OUTPUT"
            echo "warning: $f not found, falling back" >&2
          fi

      - name: Tauri build & upload bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 只有 Windows 腿真正用到（macOS 腿没有 createUpdaterArtifacts）。
          # 私钥是无密码的，所以绝不能设 TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # 便携版 + 源码包：仓库自定义产物，tauri-action 不会生成
      # 必须 pwsh（PS5.1 会按 ANSI 读脚本里的中文注释，见 MEMORY 硬约束）
      - name: Assemble portable + source zip
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: pwsh scripts/make-portable.ps1

      - name: Upload portable + source to release
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            .release_tmp/YiziMarkdown_*_x64-portable.zip \
            .release_tmp/YiziMarkdown_*_source.zip \
            --clobber
