<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
<title id="t">YiziMarkdown — 七种模式</title>
<desc id="d">同一份 Markdown 文档的七种呈现方式。源码、并排、实时、预览四种编辑视图共享 CodeMirror 6 内核，由 F3 循环切换；演示、阅读、禅三种独立场景各有专属入口。</desc>
<defs>
  <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#002FA7" stop-opacity=".18"/>
    <stop offset="1" stop-color="#002FA7" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sweepG" x1="0" x2="1">
    <stop offset="0" stop-color="#002FA7" stop-opacity="0"/>
    <stop offset=".5" stop-color="#002FA7" stop-opacity=".12"/>
    <stop offset="1" stop-color="#002FA7" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="hubClip"><rect x="380" y="300" width="440" height="88" rx="44"/></clipPath>
  <style>
    .pop{transform-box:fill-box;transform-origin:center;animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
    @keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
    .beat{opacity:0;animation:beat 12s ease-in-out infinite}
    @keyframes beat{0%,100%{opacity:0}4%{opacity:1}13%{opacity:0}}
    .pulse{animation:pulse 2.6s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}
    .march{animation:march 1.4s linear infinite}
    @keyframes march{to{stroke-dashoffset:-18}}
    .comet{animation:comet 6s linear infinite}
    @keyframes comet{to{stroke-dashoffset:-175.9}}
    .sweep{animation:sweep 3.6s ease-in-out infinite}
    @keyframes sweep{0%{transform:translateX(-90px)}60%,100%{transform:translateX(440px)}}
    .draw{stroke-dasharray:999;stroke-dashoffset:999;animation:draw 4s ease-in-out infinite}
    @keyframes draw{0%{stroke-dashoffset:999}50%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}.motion{display:none}}
  </style>
</defs>

<rect width="1200" height="675" rx="16" fill="#f7f8fc"/>

<g font-family="Inter, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif">
  <text x="600" y="60" text-anchor="middle" font-size="30" font-weight="800" fill="#1b2340"><tspan fill="#F37021">Yizi</tspan><tspan fill="#002FA7">Markdown</tspan> · 七种模式</text>
  <text x="600" y="90" text-anchor="middle" font-size="13" letter-spacing=".5" fill="#5a6480">同一份文档，七种呈现 —— 前四种编辑视图用 F3 循环，后三种独立场景各有入口</text>
</g>

