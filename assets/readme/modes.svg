</g>
<g class="draw" transform="translate(256 110) scale(0.8)" fill="none" stroke="#F37021" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.8 4.5v3.6h-3.6"/>
</g>
<text x="282" y="124" font-size="10" font-weight="700" fill="#F37021" font-family="Inter, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif">F3</text>

